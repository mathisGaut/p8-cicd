# Pipeline CI générique : un seul fichier pour l'appli Angular ET l'appli Java.
# Phases couvertes : tests, puis build et publication des images Docker sur ghcr.io. Les projets présents dans le dépôt sont détectés automatiquement
# (racine ou sous-dossiers) et testés en parallèle via une matrice.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# Droits minimaux du GITHUB_TOKEN ("checks" : rapport de tests, "packages" : push sur ghcr.io)
permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  # Job 1 : détecte les projets Angular / Java et construit la matrice du job de test
  detect:
    name: Détection des projets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          entries=""
          for dir in . */; do
            dir="${dir%/}"
            if [ -f "$dir/package.json" ] && grep -q '"@angular/core"' "$dir/package.json"; then
              entries="$entries{\"dir\":\"$dir\",\"type\":\"angular\"},"
            elif [ -f "$dir/build.gradle" ] && [ -f "$dir/gradlew" ]; then
              entries="$entries{\"dir\":\"$dir\",\"type\":\"java\"},"
            fi
          done
          if [ -z "$entries" ]; then
            echo "::error::Aucun projet Angular ou Gradle/Java détecté"
            exit 1
          fi
          echo "matrix={\"include\":[${entries%,}]}" >> "$GITHUB_OUTPUT"

  # Job 2 : tests, un run par projet détecté ; les étapes sont choisies via des conditions (if:)
  test:
    name: Tests (${{ matrix.type }})
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      # --- Angular ---
      - name: Installer Node.js (cache npm)
        if: matrix.type == 'angular'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Installer les dépendances
        if: matrix.type == 'angular'
        run: npm ci

      - name: Lancer les tests Angular
        if: matrix.type == 'angular'
        run: npm test

      # --- Java / Gradle ---
      - name: Installer le JDK
        if: matrix.type == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurer Gradle (cache des dépendances)
        if: matrix.type == 'java'
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ matrix.dir }}

      - name: Lancer les tests Java
        if: matrix.type == 'java'
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon

      # --- Rapport (JUnit XML) intégré à GitHub ---
      - name: Publier le rapport de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Rapport de tests (${{ matrix.type }})
          working-directory: ${{ matrix.dir }}
          path: ${{ matrix.type == 'angular' && 'reports/**/*.xml' || 'build/test-results/test/*.xml' }}
          reporter: java-junit
          fail-on-error: false

      - name: Archiver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.type }}
          path: ${{ matrix.dir }}/${{ matrix.type == 'angular' && 'reports' || 'build/reports/tests/test' }}
          if-no-files-found: warn

  # Job 3 : build de l'image Docker de chaque projet, vérification, puis publication sur ghcr.io
  # (uniquement sur push : pas de publication depuis une pull request)
  build:
    name: Build Docker (${{ matrix.type }})
    needs: [detect, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # Tag lisible : <branche>-<sha court>, ex. main-1a2b3c4 (le nom d'image doit être en minuscules)
      - name: Calculer le nom et les tags de l'image
        id: meta
        run: |
          branch="$(echo "$GITHUB_REF_NAME" | tr '/' '-' | tr 'A-Z' 'a-z')"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.type }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=${branch}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) Build local (sans push) pour pouvoir tester l'image
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.type }}
          cache-to: type=gha,mode=max,scope=${{ matrix.type }}

      # 2) Vérification que l'image est fonctionnelle
      - name: Vérifier l'image Angular (nginx sert l'application)
        if: matrix.type == 'angular'
        run: |
          docker run -d --name smoke -p 8080:80 "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ | grep -qi '<app-root' && exit 0
            sleep 2
          done
          docker logs smoke
          echo "::error::L'image Angular ne sert pas l'application"
          exit 1

      # L'application Java a besoin de PostgreSQL pour démarrer : on vérifie ici le contenu de l'image
      - name: Vérifier l'image Java (JAR Spring Boot présent, JRE 21)
        if: matrix.type == 'java'
        run: |
          image="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker run --rm --entrypoint sh "$image" -c 'test -s /app/app.jar && java -version'

      # 3) Publication (le cache de l'étape 1 évite de tout reconstruire)
      - name: Publier l'image sur ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.type }}
